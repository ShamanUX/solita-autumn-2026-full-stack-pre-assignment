services:
  db:
    image: electricity-db:local
    restart: always
    environment:
      POSTGRES_USER: academy
      POSTGRES_PASSWORD: academy
      POSTGRES_DB: electricity
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${POSTGRES_PORT:-15432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U academy -d electricity && [ \"$$(psql -U academy -d electricity -tAc 'SELECT EXISTS (SELECT 1 FROM electricitydata)')\" = 't' ]"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: electricity-api:local
    restart: on-failure
    environment:
      DATABASE_URL: postgresql://academy:academy@db:5432/electricity
      HOST: 0.0.0.0
      PORT: 3030
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "3030:3030"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3030/health').then(response => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  adminer:
    image: adminer:5.4.2
    restart: always
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8088:8080"
